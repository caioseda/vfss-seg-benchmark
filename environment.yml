name: vfss
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - numpy
  - ipykernel
  - ipywidgets<8   # 8.x tem um bug conhecido com o renderer de widgets do VS Code (Output nao registra)
  - pandas
  - plotly
  - nbformat
  - scikit-learn
  - openpyxl
  - black
  - jinja2
  - matplotlib
  - setuptools<81
  - pytorch::pytorch==2.4.0
  - pytorch::torchvision==0.19.0
  - pytorch::torchaudio==2.4.0
  - pytorch::pytorch-cuda=12.4
  - pytorch-lightning
  - torchmetrics
  - conda-forge::tensorboard
  - conda-forge::mlflow
  - conda-forge::einops
  - pip:
    - omegaconf
    - protobuf==3.20.*
    - pytz 
    - timm==1.0.25
    # Only needed to PREPARE the ACDC reproduction data (scripts/prepare_acdc.py reads .nii.gz).
    # Training and evaluation never import it.
    - nibabel
