name: vfss-unm-unet
type: experiment

model:
  target: src.models.unet.UNet
  params:
    n_channels: 3
    n_classes: 2
    bilinear: True

optimizer:
  target: torch.optim.AdamW
  params:
    lr: 1e-3
    weight_decay: 1e-4
  
trainer:
  target: src.trainers.base.TrainerFromConfig
  params:
    max_epochs: 100
    accelerator: auto
    devices: auto
    check_val_every_n_epoch: 2
    accumulate_grad_batches: 1
  callbacks:
    - target: src.callbacks.PrintDeviceCallback
    
    # - target: mlflow.pytorch.MlflowModelCheckpointCallback
    #   params:
    #     monitor: val/loss
    #     mode: min
    # - target: pytorch_lightning.callbacks.EarlyStopping
    #   params:
    #     monitor: val/loss
    #     mode: min
    #     patience: 10

data:
  target: src.data.base.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 8
    wrap: False
    shared_dataset_params:
      dataset_path: /data_ssd/caioseda/data/dataset_unm
      size: 256
      window_size: 1
      stride: 1
      repeat_channels: True
      image_interpolation: bilinear
      mask_interpolation: nearest
      # split_mode: 'legado' (default) reproduces the historical train/val/test split via
      # the `split_legado` column. Set to 'seed' to divide the dataset pool at run time by
      # `paciente_id`, varying `split_seed` to test alternative splits (recorded in the run
      # logs for reproducibility).
      # split_mode: 'seed'
      # split_seed: 42
      # split_ratios: [0.7, 0.1, 0.2]
      # target_type: 'mask'  # 'mask' | 'points'
      # target_variant: 'raw'  # 'raw' | 'binary_c2_c4' | 'binary_c2_c3_c4' | 'multiclass_c2_c4' | 'multiclass_c2_c3_c4' | 'multiclass_all'
    train:
      target: src.data.unm.VFSSUnmTrain
    validation:
      target: src.data.unm.VFSSUnmVal
    test:
      target: src.data.unm.VFSSUnmTest
