# E2 -- DTC-TRUS (github.com/DYDevelop/DTC-TRUS), ETAPA 2: aluno 2D sem GT, professor congelado da etapa 1
#
# Mesmo molde dos outros configs de configs/experiment/e2/ (trainer, sampler 8+8, pool, validacao, teste);
# difere em `lit_module` e no dataset de treino (vizinho t-1 para TODOS os centrais). Logica e fidelidade ao
# original: src/models/ssl/dtc_trus.py.
#
# ETAPA 1 = a celula `supervised` pareada do mesmo sweep (mesma seed/arquitetura/politica/fold): o sweep
# (src/sweeps/e2.py, `teacher_from`) preenche `teacher_checkpoint` com o best.ckpt dela. Rodado sozinho, este
# YAML exige  --set lit_module.params.teacher_checkpoint=<best.ckpt de um run supervisionado da MESMA arquitetura>.
#
# Regime: treino FINAL -- todos os 5 folds do desenvolvimento em 'train' + pool de frames nunca anotados,
# checkpoint pela validacao fixa (val/dice_patient, pelo ALUNO), avaliacao unica no TESTE INCA e no UNM.
#
# Lote: 8 rotulados + 8 nao rotulados como nos demais metodos, mas a etapa 2 e FIEL ao original e NAO usa
# GT: os 16 centrais recebem pseudo-rotulo por flip + KD; a GT dos rotulados so entra em diagnosticos.
name: e2-dtc-trus
type: experiment

model:
  target: src.models.smp.adapters.SMPModel
  params:
    arch: DeepLabV3Plus
    encoder_name: resnet34
    encoder_weights: imagenet       # o aluno parte do ImageNet (nao herda os pesos do professor), como no original
    input_normalization: imagenet
    n_channels: 3
    n_classes: 2

lit_module:
  target: src.models.ssl.dtc_trus.DTCTRUSLitWrapper
  params:
    # Augmentation fraca -- fator COMUM a todos os metodos do E2. Aqui no lote inteiro, levando a geometria
    # tambem a vizinhos, fluxo (vetores girados) e M_noc.
    student_augment: weak
    report_class_ids: {1: FG}
    surface_metric_stages: [test]
    log_pseudo_label_quality: True   # train/flip_pl_* e train/teacher_* contra a GT dos rotulados (so diagnostico)
    teacher_checkpoint: null         # preenchido pelo sweep (best.ckpt da celula `supervised` pareada)
    teacher_run_id: null
    # Pesos FIXOS do original (sem warm-up/rampa): 3*L_seg + 1*L_KD + 2*L_con + 0.1*L_proto.
    seg_weight: 3.0
    kd_weight: 1.0
    kd_temperature: 4.0
    con_weight: 2.0
    proto_weight: 0.1
    use_prototype: True
    proto_percentile: 0.7
    warp_convention: dtc_trus        # tem de ser a mesma do dataset de treino

# Protocolo comum do E2 (nao o lr=1e-3 + CosineAnnealingWarmRestarts + grad-clip do original).
optimizer:
  target: torch.optim.AdamW
  params:
    lr: 0.0002987741102824           # DeepLabV3+ congelada no E1; o sweep reescreve por arquitetura
    weight_decay: 3.681754774371584e-06

lr_scheduler:
  target: torch.optim.lr_scheduler.CosineAnnealingLR
  params:
    T_max: 8000
    eta_min: 1e-6
  interval: step

trainer:
  params:
    max_steps: 8000
    max_epochs: -1
    accelerator: auto
    devices: auto
    val_check_interval: 500
    check_val_every_n_epoch: null
    accumulate_grad_batches: 1
  checkpoint:
    monitor: val/dice_patient
    mode: max
    save_top_k: 1
    filename: 'best-{epoch}-{step}'
  callbacks:
    - target: src.callbacks.PrintDeviceCallback
    - target: src.callbacks.PatientValidation
      params:
        num_classes: 2
        class_ids: {1: FG}
    # Tempo, VRAM, tamanho do modelo e carga por passo -> run.json (`resources`) e a tabela comparativa.
    # O custo da etapa 1 e o da celula `supervised` pareada (somado na tabela).
    - target: src.callbacks.ResourceMonitor
      params:
        input_size: 256

data:
  target: src.data.base.DataModuleFromConfig
  params:
    batch_size: 16          # val/teste; o treino usa o TwoStreamBatchSampler abaixo
    num_workers: 16         # o pool nao cabe em cache; os workers decodificam e calculam o fluxo
    persistent_train_workers: True
    cache_splits: [validation, test]
    cache_num_workers: 8
    wrap: False
    train_batch_sampler:
      target: src.data.samplers.TwoStreamBatchSampler
      params:
        labeled_batch_size: 8
        unlabeled_batch_size: 8
        seed: 42
        unlabeled_policy: global
    shared_dataset_params:
      dataset_path: /data_ssd/caioseda/data/dataset_inca_all_frames/
      size: 256
      window_size: 1
      stride: 1
      repeat_channels: True
      mask_interpolation: nearest
      target_variant: 'binary_all'
      split_mode: protocol
      split_file: configs/splits/inca-protocolo-s42.csv
      split_group_column: paciente_id
      train_folds: null       # todos os folds do desenvolvimento
      cv_fold: null
      holdout_test: true      # 'test' = teste INCA (23 pacientes). Treino final.
      label_fraction: 1.0
      label_seed: 42
      label_group_column: paciente_id
    train:
      target: src.data.vfss_frame_dataset.VFSSIncaTemporalTrain
      params:
        use_unlabeled_pool: true
        unlabeled_pool_size: null
        unlabeled_pool_frame_stride: 1
        unlabeled_pool_seed: 42
        unlabeled_pool_splits: [train]
        # Um par (t-1 -> t) por central; `all`: os rotulados tambem trazem vizinho, porque na etapa 2 todo
        # frame e tratado como nao rotulado.
        neighbor_offsets: [-1]
        neighbor_gap: 1
        neighbors_for: all
        flow_method: farneback          # padrao do original
        flow_preprocess: vfss
        warp_convention: dtc_trus
    validation:
      target: src.data.vfss_frame_dataset.VFSSIncaVal
    test:
      target: src.data.vfss_frame_dataset.VFSSIncaTest
