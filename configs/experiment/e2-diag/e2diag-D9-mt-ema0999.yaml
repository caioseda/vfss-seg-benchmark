# GERADO por scripts/e2_diag.py -- não editar à mão.
# D9: teacher mais lento (menos acoplado ao student) sem augmentation evita o colapso?
name: e2diag-D9-mt-ema0999
type: experiment
model:
  target: src.models.smp.adapters.SMPModel
  params:
    arch: DeepLabV3Plus
    encoder_name: resnet34
    encoder_weights: imagenet
    input_normalization: imagenet
    n_channels: 3
    n_classes: 2
lit_module:
  target: src.models.ssl.mean_teacher.MeanTeacherLitWrapper
  params:
    report_class_ids:
      1: FG
    surface_metric_stages:
    - test
    ema_decay: 0.999
    noise_std: 0.1
    noise_clamp: 0.2
    evaluate_with_teacher: true
    consistency_weight: 0.1
    consistency_rampup_fraction: 1.0
    consistency_warmup_fraction: 0.0333
    log_pseudo_label_quality: true
optimizer:
  target: torch.optim.AdamW
  params:
    lr: 0.0002987741102824
    weight_decay: 3.681754774371584e-06
lr_scheduler:
  target: torch.optim.lr_scheduler.CosineAnnealingLR
  params:
    T_max: 8000
    eta_min: 1.0e-06
  interval: step
trainer:
  params:
    max_steps: 8000
    max_epochs: -1
    accelerator: auto
    devices: auto
    val_check_interval: 500
    check_val_every_n_epoch: null
    accumulate_grad_batches: 1
  checkpoint:
    monitor: val/dice_patient
    mode: max
    save_top_k: 1
    filename: best-{epoch}-{step}
  callbacks:
  - target: src.callbacks.PrintDeviceCallback
  - target: src.callbacks.PatientValidation
    params:
      num_classes: 2
      class_ids:
        1: FG
  - target: src.callbacks.ResourceMonitor
    params:
      input_size: 256
  - target: src.callbacks.PatientValidation
    params:
      num_classes: 2
      class_ids:
        1: FG
      prefix: val_student
      forward_attr: forward
  - target: src.callbacks.MTEvalProbe
    params:
      num_classes: 2
      class_ids:
        1: FG
      recal_batches: 32
      train_eval_batches: 8
      unlabeled_probe_batches: 4
  snapshots:
    every_n_train_steps: 1000
data:
  target: src.data.base.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 16
    persistent_train_workers: true
    cache_splits:
    - validation
    cache_num_workers: 8
    wrap: false
    train_batch_sampler:
      target: src.data.samplers.TwoStreamBatchSampler
      params:
        labeled_batch_size: 8
        unlabeled_batch_size: 8
        seed: 42
        unlabeled_policy: global
    shared_dataset_params:
      dataset_path: /data_ssd/caioseda/data/dataset_inca_all_frames/
      size: 256
      window_size: 1
      stride: 1
      repeat_channels: true
      mask_interpolation: nearest
      target_variant: binary_all
      split_mode: protocol
      split_file: configs/splits/inca-protocolo-s42.csv
      split_group_column: paciente_id
      train_folds: null
      cv_fold: null
      holdout_test: true
      label_fraction: 1.0
      label_seed: 42
      label_group_column: paciente_id
    train:
      target: src.data.vfss_frame_dataset.VFSSIncaTrain
      params:
        use_unlabeled_pool: true
        unlabeled_pool_size: null
        unlabeled_pool_frame_stride: 1
        unlabeled_pool_seed: 42
        unlabeled_pool_splits:
        - train
    validation:
      target: src.data.vfss_frame_dataset.VFSSIncaVal
