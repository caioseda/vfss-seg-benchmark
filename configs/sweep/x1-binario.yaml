# X1, variante BINARIA -- fundo contra estrutura (C2+C4 fundidos numa unica classe de
# primeiro plano). Mesma grade de orcamentos do X1; o que muda e o alvo.
#
#   scripts/submit.sh configs/sweep/x1-binario.yaml
type: sweep
name: x1-binario
family: x1-binario
plan: src.sweeps.x1.X1Sweep
# Prefixo distinto do `x1`, para que a variante binaria nao divida diretorio de run
# com a multiclasse -- ver x1-frames-per-video-multiclass-all.yaml.
run_name_prefix: x1-binario

# Ordem dos eixos = ordem em que as celulas rodam (produto cartesiano, primeiro eixo mais externo).
axes:
  seed: [42]
  label_fraction: [0.25, 0.50, 0.75, 1.00]
  method: [supervised, fixmatch, meanteacher, diffrect]

base_configs:
  supervised:  configs/experiment/x1-binario/x1-binario-unet-supervised.yaml
  fixmatch:    configs/experiment/x1-binario/x1-binario-unet-fixmatch.yaml
  meanteacher: configs/experiment/x1-binario/x1-binario-unet-meanteacher.yaml
  diffrect:    configs/experiment/x1-binario/x1-binario-unet-diffrect.yaml

training:
  # Orcamento de compute FIXO em passos: todo run ve o mesmo numero de imagens, independente do
  # orcamento de anotacao. `max_steps` tambem ancora o cronograma de consistencia.
  max_steps: 8000
  val_every_n_steps: 500      # convertido em `check_val_every_n_epoch` por celula, ver src/sweeps/x1.py
  batch_size: 8
  labeled_batch_size: 4       # os outros 4 vem do fluxo nao rotulado, em TODOS os orcamentos
  unlabeled_policy: same_video  # o efeito desta escolha e o objeto do X1B, nao deste sweep

data:
  dataset_path: /data_ssd/caioseda/data/dataset_inca_all_frames/
  # O fold unico do X1: fixo em todos os runs, para que a comparacao seja entre orcamentos de
  # rotulo e nao entre splits.
  split_seed: 42
  split_ratios: [0.7, 0.10, 0.2]
  split_group_column: paciente_id
  # label_seed FIXO garante o aninhamento entre orcamentos: revelados(25%) subset revelados(50%) ...
  label_seed: 42
  label_group_column: paciente_id
  # Pool nao rotulado REAL, identico em todos os orcamentos -- e a variavel que NAO varia, e o que
  # permite medir o ganho do SSL tambem em label_fraction=1.0.
  unlabeled_pool_size: 8000
  unlabeled_pool_frame_stride: 3   # frames consecutivos de VFSS sao quase identicos
  unlabeled_pool_seed: 42
  unlabeled_pool_splits: [train]

evaluation:
  num_classes: 2
  # 0=fundo, 1=estrutura (C2+C4 fundidos por target_variant=binary_c2_c4)
  class_ids: {1: FG}

results_csv: results_per_sample.csv
